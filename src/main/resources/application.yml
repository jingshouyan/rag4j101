spring:
  application:
    name: rag4j101

  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
      embedding:
        enabled: true
        options:
          model: deepseek-embedding

    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: 6334
        collection-name: rag_demo
        use-tls: false
        initialize-schema: true

server:
  port: 8080
